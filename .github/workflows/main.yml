name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Build
        run: |
          if [ -f gradlew ]; then
            DIR=.
          else
            ZIP=$(find . -maxdepth 3 -iname '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then echo "NO PROJECT FOUND"; ls -R | head -50; exit 1; fi
            mkdir work
            unzip -q "$ZIP" -d work
            DIR=work/moreculling-extra
          fi
          cd "$DIR"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: moreculling_extra-jar
          path: |
            build/libs/*.jar
            work/moreculling-extra/build/libs/*.jar
